# luigi level config
[luigi_core]
local_scheduler = true
module = aframe
log_level = INFO

[core]
# this needs to be an absolute path
inherit = $AFRAME_REPO/aframe/pipelines/sandbox/configs/base.cfg

# override ringdown specific parameters
[luigi_base]
prior = priors.priors.ringdown_prior
# A ringdown has no inspiral to capture, so `right_pad` here is
# the span from the ringdown onset to the right edge of the generated
# waveform, i.e. the length of the ringdown itself. The longest damping
# time the prior admits is tau = Q / (pi * f) = 20 / (pi * 100) = 64 ms,
# so 2 s is ~30 e-foldings and the tail is numerically zero. Keeping
# right_pad at the CBC value also keeps the training-time kernel
# slicing padding-free (see the pad discussion in ringdown.yaml).
waveform_duration = 4
right_pad = 2
kernel_length = 1.5

[luigi_TrainingWaveforms]
waveform_type = ringdown

[luigi_ValidationWaveforms]
waveform_type = ringdown

[luigi_TestingWaveforms]
waveform_type = ringdown

# NOTE: the whole chain runs for ringdowns, sensitivity included. Run
# `aframe.pipelines.sandbox.Sandbox`; SandboxSV pulls SandboxInfer, which
# pulls ExportLocal and TestingWaveforms, so none needs naming.

# ExportLocal and the infer tasks declare train_task as a
# luigi.TaskParameter with no default (aframe/tasks/export/export.py:30,
# aframe/tasks/infer/base.py:45), and it is bound only on the Sandbox and
# Tune pipeline classes (aframe/pipelines/sandbox/sandbox.py:34,38).
# Nothing stops at Export or Infer, so naming it here is what makes each
# a usable target on its own.
#
# SandboxInfer, not Infer: base.cfg configures [luigi_SandboxInfer], and
# the two are separate luigi task families, so a bare Infer cannot
# resolve ifos or any of the other inference settings.
[luigi_ExportLocal]
train_task = Train

[luigi_SandboxInfer]
train_task = Train
# waveform_type is declared on InferParameters, so TestingWaveforms.req()
# forwards it (aframe/tasks/infer/base.py:134) and an explicit value here
# would override [luigi_TestingWaveforms]. Deriving it instead keeps the
# campaign's family and the family inference reads it with in one place.
waveform_type = &::luigi_TestingWaveforms::waveform_type

[luigi_Train]
train_config = $AFRAME_REPO/projects/train/configs/ringdown.yaml
ifos = &::luigi_base::ifos
fftlength = &::luigi_base::fftlength
kernel_length = &::luigi_base::kernel_length
sample_rate = &::luigi_base::sample_rate
highpass = &::luigi_base::highpass
lowpass = &::luigi_base::lowpass
fduration = &::luigi_base::fduration
seed = &::luigi_base::seed
use_wandb = true
precompute_train_waveforms = true

[luigi_SandboxSV]
train_task = Train
# waveform_type is a common parameter: SandboxSV.requires() forwards it to
# TestingWaveforms and SandboxInfer (aframe/pipelines/sandbox/sandbox.py:19-20),
# so an explicit value here would override both of those config sections
# while leaving their output paths unchanged. Derive it instead.
waveform_type = &::luigi_TestingWaveforms::waveform_type
source_prior = &::luigi_base::prior
# Median source-frame remnant masses. Every one has joint support coverage
# above 0.9999 at sigma = 0.1; 250 was dropped because it covers 0.2491.
remnant_mass_combos = [40, 80, 120, 150]
sigma = 0.1
