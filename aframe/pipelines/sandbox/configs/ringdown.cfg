# luigi level config
[luigi_core]
local_scheduler = true
module = aframe
log_level = INFO

[core]
# this needs to be an absolute path
inherit = $AFRAME_REPO/aframe/pipelines/sandbox/configs/base.cfg

# override ringdown specific parameters
[luigi_base]
prior = priors.priors.ringdown_prior
# A ringdown has no inspiral to capture, so `right_pad` here is
# the span from the ringdown onset to the right edge of the generated
# waveform, i.e. the length of the ringdown itself. The longest damping
# time the prior admits is tau = Q / (pi * f) = 20 / (pi * 100) = 64 ms,
# so 2 s is ~30 e-foldings and the tail is numerically zero. Keeping
# right_pad at the CBC value also keeps the training-time kernel
# slicing padding-free (see the pad discussion in ringdown.yaml).
waveform_duration = 4
right_pad = 2
kernel_length = 1.5

[luigi_TrainingWaveforms]
waveform_type = ringdown

[luigi_ValidationWaveforms]
waveform_type = ringdown

[luigi_TestingWaveforms]
waveform_type = ringdown

# NOTE: TestingWaveforms now generates ringdowns, but the full Sandbox
# pipeline still cannot be run from this config, and building the missing
# export/infer/plots containers will not be enough on its own: inference,
# recovery and sensitivity analysis each still hardcode the CBC classes
# (projects/infer/infer/data.py, RecoveredInjectionSet in
# ledger/events.py, and SensitiveVolume's mass_combos). Run
# `aframe.tasks.TestingWaveforms` or `aframe.tasks.Train` for now.

[luigi_Train]
train_config = $AFRAME_REPO/projects/train/configs/ringdown.yaml
ifos = &::luigi_base::ifos
fftlength = &::luigi_base::fftlength
kernel_length = &::luigi_base::kernel_length
sample_rate = &::luigi_base::sample_rate
highpass = &::luigi_base::highpass
lowpass = &::luigi_base::lowpass
fduration = &::luigi_base::fduration
seed = &::luigi_base::seed
use_wandb = true
precompute_train_waveforms = true
